name: Backend

on:
  pull_request:
    paths: ["backend/**", "inference/**", "dev/**", "serve_models/**", ".github/workflows/backend.yml"]
  push:
    branches: [main, dev]
    paths: ["backend/**", "inference/**", "dev/**", "serve_models/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt ruff
      - run: ruff check backend inference dev/agentic dev/rag/lightweight_retriever.py
      - run: python -m compileall -q backend inference dev/agentic
      - run: pytest backend/tests -q --cov=backend --cov-report=term-missing --cov-fail-under=60
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./ci-mechsage.db
          REQUIRE_API_KEY: "false"
          SIMULATION_AUTO_START: "false"
          GOOGLE_API_KEY: test-key
