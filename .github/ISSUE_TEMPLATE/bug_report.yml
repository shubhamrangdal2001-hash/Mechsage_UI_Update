name: Bug report
description: Report a reproducible MechSage defect
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, production telemetry, or confidential documents.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Start...\n2. Open...\n3. Observe..."
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Frontend, Backend API, ML inference, RAG, Agent workflow, Database, CI/CD]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
